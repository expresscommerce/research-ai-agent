services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research_platform
      POSTGRES_USER: ${DB_USER:-researcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-researcher_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-researcher}:${DB_PASSWORD:-researcher_secret}@postgres/research_platform
      QDRANT_URL: http://qdrant:6333
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-must-be-64-chars-long-ok!!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - qdrant

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
